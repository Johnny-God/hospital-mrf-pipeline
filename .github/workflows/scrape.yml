name: hospital-scrape
on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
    inputs:
      total:
        description: "shard count"
        default: "50"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
    steps:
      - id: gen
        run: echo "shards=$(python3 -c "print(list(range(int('${{ github.event.inputs.total || 50 }}'))))")" >> "$GITHUB_OUTPUT"

  scrape:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ${{ fromJson(needs.matrix.outputs.shards) }}
      max-parallel: 20
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -L https://github.com/dolthub/dolt/releases/latest/download/dolt-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin --strip-components=1 dolt-linux-amd64/dolt
          dolt version
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ijson requests click openpyxl pandas httpx
      - name: Full chain — scrape, convert, import, push, PR
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ github.event.inputs.total || '50' }}
          DOLT_CREDS_JWK: ${{ secrets.DOLT_CREDS_JWK }}
          DOLTHUB_TOKEN: ${{ secrets.DOLTHUB_TOKEN }}
        run: bash ci/pipeline.sh
